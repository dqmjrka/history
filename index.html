<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>История Выживания - Shorts Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    /* Вертикальный контейнер 9:16 */
    .phone-frame {
      width: 360px;
      height: 640px;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
      border: 3px solid #2e3b4e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Анимированный фон для атмосферы */
    .bg-animation {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
      z-index: 1;
    }

    .snow-effect {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
      background-size: 24px 24px;
      animation: drift 12s linear infinite;
      z-index: 1;
    }

    @keyframes drift {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(200px) rotate(5deg); }
    }

    /* Контейнер субтитров */
    .subtitle-box {
      position: relative;
      z-index: 2;
      width: 88%;
      text-align: center;
      padding: 20px 10px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .subtitle-text {
      font-size: 1.65rem;
      font-weight: 900;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1.3;
      text-shadow: 
        0 4px 0 #000,
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000,
         0 0 20px rgba(0, 0, 0, 0.9);
      transition: transform 0.15s ease;
    }

    .subtitle-text.pop {
      transform: scale(1.07);
      color: #ffdd00;
    }

    .subtitle-text.outro {
      color: #ff4757;
      font-size: 1.5rem;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* Прогресс-бар внизу видео */
    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 6px;
      background: #ff4757;
      width: 0%;
      z-index: 3;
      transition: width 0.2s linear;
    }

    /* Панель управления под экраном */
    .controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 360px;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    button, a.download-btn {
      flex: 1;
      padding: 13px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active, a.download-btn:active {
      transform: scale(0.98);
    }

    .start-btn {
      background: #ff4757;
      color: #fff;
    }

    .start-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }

    .download-btn {
      background: #2ed573;
      color: #111;
      display: none;
    }

    .status {
      font-size: 0.85rem;
      color: #a4b0be;
      text-align: center;
      min-height: 20px;
    }

    select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      background: #1e272e;
      color: #fff;
      border: 1px solid #485460;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="phone-frame" id="screen">
    <div class="snow-effect"></div>
    <div class="bg-animation"></div>
    <div class="subtitle-box">
      <div class="subtitle-text" id="subtitle">НАЖМИ СТАРТ</div>
    </div>
    <div class="progress-bar" id="progress"></div>
  </div>

  <div class="controls">
    <select id="voiceSelect" title="Выбор голоса ElevenLabs">
      <option value="pNInz6obpgDQGcFmaJgB">Голос: Adam (Глубокий рассказчик)</option>
      <option value="TxGEqnHWrfWFTfGW9XjX">Голос: Josh (Молодой / Динамичный)</option>
      <option value="VR6AewLTigWG4xSOukaG">Голос: Arnold (Напряженный)</option>
      <option value="ErXwobaYiN019PkySvjV">Голос: Antoni (Чистый / Быстрый)</option>
    </select>

    <div class="btn-row">
      <button class="start-btn" id="startBtn">▶ СТАРТ</button>
      <a class="download-btn" id="downloadBtn" download="survival_story.mp3">⬇ СКАЧАТЬ MP3</a>
    </div>
    <div class="status" id="statusText">Готово к генерации озвучки (~50 сек)</div>
  </div>

  <script>
    // Внимание: поскольку ключ был опубликован в открытом доступе, рекомендуем заменить его в личном кабинете ElevenLabs после тестов
    const API_KEY = "sk_54b84242ac4c007aef5321f971aa9ddb01f045ebe5177c9a";

    // Текст первой части (озвучивается голосом, рассчитан примерно на 45-50 секунд)
    const spokenScript = `Короче, первая серия. Я решил переночевать один в старой лесной избе зимой. Вечером затопил печь, проверил замки и лег спать, всё было как обычно. На следующую ночь я просыпаюсь ровно в три пятнадцать от странного скрежета. Смотрю в окно, а стекло замёрзло, и кто-то снаружи прямо сейчас пальцем выводит по инею слово: ВЫХОДИ. Мне стало жутко не по себе. Я схватил фонарик, побежал на кухню проверить заднюю дверь — она закрыта. Возвращаюсь обратно в комнату, свечу на окно, а там надписи уже нет, и вместо неё дописывается: Я УЖЕ ВНУТРИ. Я резко оборачиваюсь к печке, смотрю на пол, вижу мокрые следы из подвала, которые ведут прямо за мою кровать, заглядываю туда, а там...`;

    // Финальный байт на комментарии (показывается БЕЗ озвучки)
    const silentOutro = "2 ЧАСТЬ СКОРО 👀 КАК ДУМАЕШЬ ЧТО ТАМ? ПИШИ ОТВЕТ В КОММЕНТАРИЯХ 👇";

    // Разбивка текста на короткие фразы для динамичных субтитров (по 2-4 слова)
    const chunks = [
      "Короче, первая серия.",
      "Я решил переночевать один",
      "в старой лесной избе зимой.",
      "Вечером затопил печь,",
      "проверил замки и лег спать,",
      "всё было как обычно.",
      "На следующую ночь",
      "я просыпаюсь ровно в 3:15",
      "от странного скрежета.",
      "Смотрю в окно,",
      "а стекло замёрзло,",
      "и кто-то снаружи прямо сейчас",
      "пальцем выводит по инею слово:",
      "ВЫХОДИ.",
      "Мне стало жутко не по себе.",
      "Я схватил фонарик,",
      "побежал на кухню",
      "проверить заднюю дверь —",
      "она закрыта.",
      "Возвращаюсь обратно в комнату,",
      "свечу на окно,",
      "а там надписи уже нет,",
      "и вместо неё дописывается:",
      "Я УЖЕ ВНУТРИ.",
      "Я резко оборачиваюсь к печке,",
      "смотрю на пол,",
      "вижу мокрые следы из подвала,",
      "которые ведут прямо за кровать,",
      "заглядываю туда, а там..."
    ];

    const startBtn = document.getElementById('startBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const subtitleEl = document.getElementById('subtitle');
    const statusText = document.getElementById('statusText');
    const progressEl = document.getElementById('progress');
    const voiceSelect = document.getElementById('voiceSelect');

    let audioPlayer = new Audio();
    let cachedAudioUrl = null;
    let lastSelectedVoice = null;
    let subtitleInterval = null;

    startBtn.addEventListener('click', async () => {
      const voiceId = voiceSelect.value;
      startBtn.disabled = true;
      subtitleEl.classList.remove('outro');

      try {
        // Если аудио еще не сгенерировано или сменили голос — запрашиваем у ElevenLabs
        if (!cachedAudioUrl || lastSelectedVoice !== voiceId) {
          statusText.textContent = "Генерация голоса через ElevenLabs...";
          subtitleEl.textContent = "ЗАГРУЗКА...";

          const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${voiceId}`, {
            method: 'POST',
            headers: {
              'Accept': 'audio/mpeg',
              'Content-Type': 'application/json',
              'xi-api-key': API_KEY
            },
            body: JSON.stringify({
              text: spokenScript,
              model_id: "eleven_multilingual_v2",
              voice_settings: {
                stability: 0.45,
                similarity_boost: 0.8,
                style: 0.35,
                use_speaker_boost: true
              }
            })
          });

          if (!response.ok) {
            const errData = await response.json().catch(() => ({}));
            throw new Error(errData.detail?.message || `Ошибка API: ${response.status}`);
          }

          const blob = await response.blob();
          if (cachedAudioUrl) URL.revokeObjectURL(cachedAudioUrl);
          cachedAudioUrl = URL.createObjectURL(blob);
          lastSelectedVoice = voiceId;

          downloadBtn.href = cachedAudioUrl;
          downloadBtn.style.display = "inline-block";
        }

        // Запуск воспроизведения и синхронизации субтитров
        audioPlayer.src = cachedAudioUrl;
        await audioPlayer.play();
        statusText.textContent = "Воспроизведение истории...";
        runSubtitlesSync();

      } catch (err) {
        console.error(err);
        statusText.textContent = "Ошибка ElevenLabs (" + err.message + "). Включен резервный синтезатор.";
        runFallbackSpeech();
      }
    });

    function runSubtitlesSync() {
      clearInterval(subtitleInterval);

      // Считаем вес каждой фразы по количеству символов для ровной синхронизации с голосом
      const totalChars = chunks.reduce((acc, str) => acc + str.length, 0);
      let cumulativeWeights = [];
      let sum = 0;
      for (const c of chunks) {
        sum += c.length;
        cumulativeWeights.push(sum / totalChars);
      }

      let lastIndex = -1;

      subtitleInterval = setInterval(() => {
        if (!audioPlayer.duration) return;

        const currentProgress = audioPlayer.currentTime / audioPlayer.duration;
        progressEl.style.width = `${Math.min(currentProgress * 100, 100)}%`;

        const currentIndex = cumulativeWeights.findIndex(w => currentProgress <= w);
        if (currentIndex !== -1 && currentIndex !== lastIndex) {
          lastIndex = currentIndex;
          subtitleEl.textContent = chunks[currentIndex];
          subtitleEl.classList.add('pop');
          setTimeout(() => subtitleEl.classList.remove('pop'), 140);
        }
      }, 50);

      audioPlayer.onended = () => {
        clearInterval(subtitleInterval);
        progressEl.style.width = "100%";
        // Показываем финальную фразу БЕЗ озвучки
        subtitleEl.classList.add('outro');
        subtitleEl.textContent = silentOutro;
        statusText.textContent = "Финал (без озвучки). Готово!";
        startBtn.disabled = false;
        startBtn.textContent = "↻ ПОВТОРИТЬ";
      };
    }

    // Резервный вариант через встроенный браузерный голос, если на ключе кончатся лимиты
    function runFallbackSpeech() {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(spokenScript);
      utterance.lang = 'ru-RU';
      utterance.rate = 1.05;

      const estimatedDuration = 46 * 1000; // ~46 секунд на озвучку + 4 сек тишины в конце
      const startTime = Date.now();
      const totalChars = chunks.reduce((acc, str) => acc + str.length, 0);
      let cumulativeWeights = [];
      let sum = 0;
      for (const c of chunks) {
        sum += c.length;
        cumulativeWeights.push(sum / totalChars);
      }

      let lastIndex = -1;
      clearInterval(subtitleInterval);

      subtitleInterval = setInterval(() => {
        const elapsed = Date.now() - startTime;
        const ratio = Math.min(elapsed / estimatedDuration, 1);
        progressEl.style.width = `${ratio * 100}%`;

        const currentIndex = cumulativeWeights.findIndex(w => ratio <= w);
        if (currentIndex !== -1 && currentIndex !== lastIndex) {
          lastIndex = currentIndex;
          subtitleEl.textContent = chunks[currentIndex];
        }
      }, 60);

      utterance.onend = () => {
        clearInterval(subtitleInterval);
        progressEl.style.width = "100%";
        subtitleEl.classList.add('outro');
        subtitleEl.textContent = silentOutro;
        startBtn.disabled = false;
        startBtn.textContent = "↻ ПОВТОРИТЬ";
      };

      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
